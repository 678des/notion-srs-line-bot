name: Daily Notion Sync and LINE Notify

on:
  schedule:
    - cron: "0 23 * * *" # UTC 23:00 = 日本時間 8:00
  workflow_dispatch: {} # 手動実行もできるようにしておく(テスト用に便利)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DATA_SOURCE_ID: ${{ secrets.DATA_SOURCE_ID }}
        run: python main.py

      - name: Commit updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge.db
          git diff --staged --quiet || git commit -m "Update knowledge.db [skip ci]"
          git push
